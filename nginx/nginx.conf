worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent upstream=$upstream_status '
                    '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 25m;

    server {
        listen 80;
        listen [::]:80;
        server_name www.noir-ride.ru;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://noir-ride.ru$request_uri;
        }
    }

    server {
        listen 80;
        listen [::]:80;
        server_name noir-ride.ru;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://noir-ride.ru$request_uri;
        }
    }

    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name www.noir-ride.ru;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        return 301 https://noir-ride.ru$request_uri;
    }

    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name noir-ride.ru;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_protocols TLSv1.2 TLSv1.3;

        # Встроенный DNS Docker. Имена контейнеров резолвятся на каждый запрос:
        # при пересборке контейнеры получают новые IP, а nginx с именованными
        # upstream'ами кеширует адрес навсегда и после ребилда может отдавать
        # бэкенд там, где должен быть фронтенд.
        resolver 127.0.0.11 valid=10s ipv6=off;

        # Регулярка проверяется раньше префикса `/`, поэтому API забирает свои
        # запросы первым. Захват $1 повторяет старое `proxy_pass http://backend/`
        # и срезает префикс /api/.
        location ~ ^/api/(.*)$ {
            set $backend_upstream http://backend:3000;
            proxy_pass $backend_upstream/$1$is_args$args;
            proxy_http_version 1.1;
            proxy_connect_timeout 60s;
            proxy_read_timeout 60s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
        }

        location / {
            set $frontend_upstream http://frontend:3000;
            proxy_pass $frontend_upstream$request_uri;
            proxy_http_version 1.1;
            proxy_connect_timeout 60s;
            proxy_read_timeout 120s;
            proxy_buffering on;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
        }
    }
}
